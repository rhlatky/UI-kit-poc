<!doctype html>
<html lang="sk" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>ui-kit-twig — vanilla HTML + JS (no framework)</title>
  <link rel="stylesheet" href="../../ui-kit-css/src/tokens.css" />
  <link rel="stylesheet" href="../../ui-kit-css/dist/button.css" />
  <link rel="stylesheet" href="../../ui-kit-css/dist/input.css" />
  <link rel="stylesheet" href="../../ui-kit-css/dist/card.css" />
  <style>body{margin:2rem;font-family:var(--ds-font-sans);display:flex;flex-direction:column;gap:1.5rem;align-items:flex-start}.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-start}h3{margin:.25rem 0;font-size:13px;color:#666;text-transform:uppercase;letter-spacing:.05em}</style>
</head>
<body>
  <!-- STATIC HTML = what Twig renders server-side (plain BEM). VANILLA JS row = same, built dynamically. -->
  <div>
    <h3>Button</h3>
    <div class="row">
      <button class="button button--primary button--md">Primary</button>
      <button class="button button--secondary button--md">Secondary</button>
      <button class="button button--ghost button--md">Ghost</button>
      <button class="button button--primary button--lg">Large</button>
      <button class="button button--primary button--md" disabled>Disabled</button>
    </div>
  </div>
  <div>
    <h3>Input</h3>
    <div class="row">
      <div class="field" style="width:220px">
        <label class="field__label">Email</label>
        <input class="field__input" placeholder="jane@x.sk" />
        <p class="field__msg">Your work email</p>
      </div>
      <div class="field" style="width:220px">
        <label class="field__label">Email</label>
        <input class="field__input field__input--invalid" placeholder="jane@x.sk" />
        <p class="field__msg field__msg--invalid">Invalid email</p>
      </div>
    </div>
  </div>
  <div>
    <h3>Card</h3>
    <div class="row">
      <div class="card card--elevated" style="width:240px">
        <div class="card__header">Elevated</div>
        <div class="card__body">Body lorem ipsum.</div>
        <div class="card__footer">Footer</div>
      </div>
    </div>
  </div>

  <div>
    <h3>Vanilla JS (createButton / createInput / createCard) — no Vue</h3>
    <div class="row" id="js-mount"></div>
  </div>
  <script type="module">
    import { createButton, createInput, createCard } from '../src/index.js'
    document.getElementById('js-mount').append(
      createButton({ variant: 'primary', size: 'md', label: 'JS Button' }),
      createInput({ label: 'JS Input', placeholder: '…', error: 'Required' }),
      createCard({ variant: 'flat', header: 'JS Card', body: 'Built with vanilla JS.', footer: 'meta' }),
    )
  </script>
</body>
</html>
